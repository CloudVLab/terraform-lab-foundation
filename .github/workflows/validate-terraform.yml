name: Validate Terraform Modules

on:
  pull_request:
    paths:
      - 'basics/**'
      - 'solutions/**'
      - '.github/workflows/validate-terraform.yml'

permissions:
  contents: read

concurrency:
  group: validate-terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Modified Terraform Modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.12.1'
          terraform_wrapper: false

      - name: Validate modified Terraform directories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          DIFF_FILES=""
          if [ -n "$BASE_SHA" ]; then
            DIFF_FILES=$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" -- 'basics/**/*.tf' 'solutions/**/*.tf')
          fi

          if [ -z "$DIFF_FILES" ]; then
            echo "No modified .tf files detected in basics/ or solutions/; skipping Terraform validation."
            exit 0
          fi

          DIRS=$(printf '%s\n' "$DIFF_FILES" | xargs -r -n1 dirname | sort -u)
          FAILED=0
          while IFS= read -r dir; do
            if [ -z "$dir" ] || [ ! -d "$dir" ] || ! compgen -G "${dir}/*.tf" > /dev/null; then
              continue
            fi
            echo "------------------------------------------------------------"
            echo "Validating: $dir"
            echo "------------------------------------------------------------"
            if ! terraform fmt -check "$dir"; then
              echo "Formatting check failed for $dir (run 'terraform fmt $dir')"
              FAILED=1
            fi
            if ! (
              cd "$dir"
              terraform init -backend=false -input=false
              terraform validate
              rm -rf .terraform .terraform.lock.hcl
            ); then
              echo "Terraform validate failed for $dir"
              FAILED=1
            fi
          done <<< "$DIRS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
